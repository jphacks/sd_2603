; M5StickS3 has no official PlatformIO board yet, so use the generic ESP32-S3
; board and let M5Unified detect the device at runtime.
[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified
  bblanchon/ArduinoJson@^7
