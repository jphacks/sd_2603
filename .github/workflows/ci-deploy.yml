name: CI and Vercel deployment

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [main, staging, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  AI_PROVIDER: mock
  ALLOW_PAID_AI: 'false'
  # PRs and manual runs always validate without deployment credentials.
  DEPLOY_TARGET: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/staging' && vars.ENABLE_PREVIEW_DEPLOYMENT == 'true') || (startsWith(github.ref, 'refs/heads/feature/') && vars.ENABLE_FEATURE_PREVIEW_DEPLOYMENT == 'true')) && 'preview' || github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOYMENT == 'true' && 'production' || '' }}

jobs:
  check-and-deploy:
    name: Lint, build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test CI helpers
        run: node --test scripts/ci/helpers.test.mjs

      - name: Validate deployment configuration
        if: env.DEPLOY_TARGET != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!variable}" ]; then
              echo "::error::$variable is missing. See docs/DEPLOYMENT_CI.md."
              exit 1
            fi
          done

      - name: Build and check TypeScript (CI only)
        if: env.DEPLOY_TARGET == ''
        run: npm run build

      - name: Install pinned Vercel CLI
        if: env.DEPLOY_TARGET != ''
        run: npm install --global vercel@63.1.2

      - name: Build Vercel artifact and check TypeScript
        if: env.DEPLOY_TARGET != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pull_args=()
          if [ "$DEPLOY_TARGET" = preview ]; then
            pull_args+=(--git-branch="$GITHUB_REF_NAME")
          fi
          vercel pull --yes --environment="$DEPLOY_TARGET" "${pull_args[@]}" --token="$VERCEL_TOKEN"
          node scripts/ci/prepare-vercel-env.mjs "$DEPLOY_TARGET"
          build_args=()
          if [ "$DEPLOY_TARGET" = production ]; then
            build_args+=(--prod)
          fi
          vercel build "${build_args[@]}" --token="$VERCEL_TOKEN"

      - name: Smoke test built app and Mock Judge
        run: node scripts/ci/smoke-test.mjs

      - name: Deploy the tested artifact (links in Summary)
        id: deployment
        if: env.DEPLOY_TARGET != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deploy_args=()
          if [ "$DEPLOY_TARGET" = production ]; then
            deploy_args+=(--prod)
          fi
          vercel deploy --prebuilt --yes --json "${deploy_args[@]}" \
            --env AI_PROVIDER=mock --env ALLOW_PAID_AI=false \
            --token="$VERCEL_TOKEN" > "$RUNNER_TEMP/vercel-deployment.json"
          node scripts/ci/report-deployment.mjs "$RUNNER_TEMP/vercel-deployment.json"

      - name: Update branch Preview URL (link in Summary)
        if: env.DEPLOY_TARGET == 'preview'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.deployment_url }}
        run: node scripts/ci/assign-preview.mjs

      - name: Report CI-only result
        if: env.DEPLOY_TARGET == ''
        run: |
          echo '### CI passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lint, TypeScript/build and Mock Judge smoke tests passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No deployment was requested. See docs/DEPLOYMENT_CI.md to enable branch deployments.' >> "$GITHUB_STEP_SUMMARY"
